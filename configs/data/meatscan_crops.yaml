# SAM-masked MeatScan cropped to the meat region (src/data/segment_meat.py) — primary dataset.
# Paths are relative to the repository root (src/main.py runs every step from there).
source: "data/raw/MeatScan"           # raw images (input of the sessions and segment steps)
root: "data/processed/full"           # prepared data: sessions.csv, masks/, masked/, crops/
path: "data/processed/full/crops"     # model input
split_file: "data/processed/full/sessions.csv"
masks: "data/processed/full/masks"
class_names: ["Fresh_CowMeat", "Spoiled_CowMeat"]
