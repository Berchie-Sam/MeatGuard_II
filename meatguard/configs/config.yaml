# MeatGuard II Master Config
mode: "training"                # Options: training, fine_tuning, inference, export
device: "cuda"
seed: 42

# --- Module Selection (Pointers to other YAMLs) ---
data: "placeholder"             # configs/data/placeholder.yaml
architecture: "meatguard_s"      # configs/model/meatguard_s.yaml
augment: "domain"               # configs/train/augment/domain.yaml

# --- Global Training Overrides ---
training:
  batch_size: 32
  epochs: 100
  lr: 1e-3
  weight_decay: 1e-4

# --- Export Configuration ---
export:
  format: "tflite_int8"         # Options: pth, onnx, tflite_fp32, tflite_int8
  output_path: "artifacts/models/meatguard_s_int8.tflite"

# --- Visualization Master Switchboard ---
visualization:
  modality: "both"              # Options: image_only, dashboard, both
  engine: "plotly"              # Options: matplotlib_sns, plotly
  style_preset: "academic_blue" # configs/viz/styles/academic_blue.yaml
  auto_visualize: true           # Visualize all pipeline outputs by default
  save_dir: "artifacts/plots"
